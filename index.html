<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>CleanHub – Games & Apps Downloads</title>

  <meta name="description" content="CleanHub provides organized information for games and apps with versions, system requirements, and trusted external links.">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Open Graph (Social Preview) -->
  <meta property="og:title" content="CleanHub – Games & Apps">
  <meta property="og:description" content="Find games and apps with clean info, versions, and system requirements.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/images/og-image.png">

  <!-- Favicon -->
  <link rel="icon" href="assets/images/favicon.png">

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<header class="topbar" role="banner">
  <div class="logo">CLEANHUB</div>

  <div class="search-wrap">
    <input
  type="text"
  placeholder="Search games or apps..."
  aria-label="Search games or apps"
/>

    <button
  id="themeToggle"
  class="theme-toggle"
  aria-label="Toggle dark or light mode"
>
  🌙
</button>

  </div>
</header>

<section class="tabs">
  <button class="tab active" data-type="games">Games</button>
  <button class="tab" data-type="apps">Apps</button>
</section>

<!-- TOP -->
<section class="hero">
  <div class="featured">
    <span class="badge">FEATURED</span>
    <h2>Featured Game / App</h2>
    <p>Optimized · Latest Version · Clean Info</p>
  </div>

  <div class="trending-row" id="trending"></div>
</section>

<!-- BOTTOM -->
<section class="latest">
  <h3>Latest Posts</h3>
  <div class="latest-grid" id="latest"></div>
</section>

<footer>
  <a href="#">Disclaimer</a>
  <a href="#">Privacy</a>
  <a href="#">Terms</a>
</footer>

<script src="assets/js/main.js"></script>
</body>
</html>
