<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CleanHub — Post</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="logo">CLEANHUB</div>
</header>

<section class="post-hero">
  <h1 id="title">Loading...</h1>
  <p id="meta"></p>
</section>

<section class="post-content single">

  <div class="post-main">
    <h3>Description</h3>
    <p>
      This is a clean, optimized release with proper version info.
      External download links only. No files are hosted.
    </p>

    <h3>Available Versions</h3>
    <ul>
      <li>Latest Stable</li>
      <li>Low-end PC version</li>
      <li>Previous build</li>
    </ul>

    <a href="#" class="download-btn">External Download Link</a>
  </div>


 

</section>

<footer>
  <a href="#">Disclaimer</a>
  <a href="#">Privacy</a>
  <a href="#">Terms</a>
</footer>

<script>
  const params = new URLSearchParams(window.location.search);

  const name = params.get("name") || "Game / App Title";
  const size = params.get("size") || "Unknown size";
  const version = params.get("version") || "Latest";

  document.getElementById("title").innerText = name;
  document.getElementById("meta").innerText =
    `${version} · Windows · ${size}`;
</script>


</body>
</html>
